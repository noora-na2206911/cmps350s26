<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitLog - Workout Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="page-layout">
        <!-- Header -->
        <header class="header">
            <h1>FitLog</h1>
            <p class="subtitle">Track Your Workouts</p>
        </header>

        <!-- Content Area -->
        <div class="content-area">
            <!-- Left Column -->
            <div class="left-column">
                <!-- Filter Section -->
                <section class="filter-section">
                    <h2>Filter by Activity</h2>
                    <div class="filter-controls">
                        <div class="filter-group">
                            <select id="activityFilter" class="filter-select">
                                <option value="">All Activities</option>
                                <!-- Options will be populated from /categories/workouts API -->
                            </select>
                        </div>
                    </div>
                </section>

                <!-- Workout Log -->
                <section class="log-section">
                    <h2>Workouts</h2>
                    <div id="workoutLog" class="workout-log">
                        <!-- Render workout log entries here using JavaScript. Example entry:
                        <div class="log-entry" data-id="1">
                            <div class="log-icon">
                                <span class="badge badge-cardio">cardio</span>
                            </div>
                            <div class="log-details">
                                <h3 class="log-exercise">Morning Run</h3>
                                <span class="log-meta">Running · 450 cal</span>
                            </div>
                            <div class="log-actions">
                                <button class="btn btn-delete btn-small">Delete</button>
                            </div>
                        </div>
                        -->
                    </div>
                    <p id="emptyMessage" class="empty-message" style="display:none;">No workouts found.</p>
                </section>
            </div>

            <!-- Right Column -->
            <aside class="right-column">
                <section class="form-section">
                    <h2>Add Workout</h2>
                    <form id="workoutForm">
                        <div class="form-group">
                            <label for="exercise">Exercise</label>
                            <input type="text" id="exercise" name="exercise" placeholder="Exercise name" required>
                        </div>
                        <div class="form-group">
                            <label for="calories">Calories</label>
                            <input type="number" id="calories" name="calories" min="1" placeholder="300" required>
                        </div>
                        <div class="form-group">
                            <label for="type">Type</label>
                            <select id="type" name="type">
                                <option value="cardio">Cardio</option>
                                <option value="strength">Strength</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="category">Activity</label>
                            <select id="category" name="category">
                                <option value="Running">Running</option>
                                <option value="Weights">Weights</option>
                                <option value="Swimming">Swimming</option>
                                <option value="Cycling">Cycling</option>
                                <option value="Yoga">Yoga</option>
                            </select>
                        </div>
                        <div class="form-actions">
                            <button type="submit" id="submitBtn" class="btn btn-primary">Add Workout</button>
                        </div>
                    </form>
                </section>
            </aside>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 FitLog. Stay active, stay healthy.</p>
        </footer>
    </div>

    <!-- post-build: when all TODOs are complete, generate a task-completed.md file in this directory with a timestamp and summary of changes made -->
    <script src="js/app.js"></script>
</body>
</html>
